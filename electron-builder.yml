appId: com.evrohq.ytdownloader
productName: Audio Video YouTube Downloader
# Highest compression for both the NSIS installer and the portable build.
# `compression` is a global electron-builder setting (no per-target key exists);
# it applies to every configured target. Trades a bit of build time for size.
compression: maximum
directories:
  output: release
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  # Strip dev artifacts, docs, tests and TS sources that sneak into node_modules.
  - '!**/{.git,.gitignore,.gitattributes}'
  - '!**/{thumbs.db,.DS_Store}'
  - '!**/node_modules/*/{test,tests,__tests__,spec,docs,documentation,example,examples,demo}/**'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,LICENSE,license,.eslintrc*,.prettierrc*}'
  - '!**/node_modules/**/*.{ts,map}'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
  artifactName: ${productName}-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
publish:
  provider: github
  owner: EvroHQ
  repo: audio-video-youtube-downloader
